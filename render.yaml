# Render Blueprint — deploy with: New > Blueprint, then point it at this repo.
#
# Render's free plan has no persistent disk: every restart, redeploy and idle spin-down wipes the
# filesystem. So nothing is stored on disk here. Set DATABASE_URL to a free Postgres database
# (Neon, Supabase) and the app keeps the directory, sessions and uploaded sheets there instead.
services:
  - type: web
    name: ctp-zonal-coordination
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard before the first boot.
      #   DATABASE_URL       the Postgres connection string (required on the free plan)
      #   CTP_ADMIN_EMAIL    seeds the administrator account on first boot
      #   CTP_ADMIN_PASSWORD leave unset and the app prints a random one to the deploy log
      - key: DATABASE_URL
        sync: false
      - key: CTP_ADMIN_EMAIL
        sync: false
      - key: CTP_ADMIN_PASSWORD
        sync: false
